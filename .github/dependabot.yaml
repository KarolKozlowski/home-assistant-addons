version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    groups:
      action-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/komodo-periphery"
    schedule:
      interval: daily
    groups:
      docker-komodo:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/openbao"
    schedule:
      interval: daily
    groups:
      docker-openbao:
        patterns:
          - "*"
